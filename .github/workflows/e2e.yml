name: Playwright E2E

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playwright-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Cross-browser E2E and Allure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test report summary utility
        run: npm run test:unit

      - name: Run Playwright tests
        id: playwright
        run: npm run test:e2e

      - name: Add browser results to job summary
        if: always() && steps.playwright.outcome != 'skipped'
        run: npm run test:summary

      - name: Generate Allure HTML report
        if: always()
        run: npm run allure:generate

      - name: Upload test reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports-${{ github.run_id }}
          path: |
            playwright-report/
            allure-results/
            allure-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure report for GitHub Pages
        if: always() && github.event_name != 'pull_request' && hashFiles('allure-report/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: e2e
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
